{% extends 'base.html' %}
{% block content %}
<h2>Your Cart</h2>
{% for item in cart_items %}
    <div>
        <h3>{{ item.product.name }}</h3>
        <p>Qty: {{ item.quantity }}</p>
        <p>₹{{ item.product.price * item.quantity }}</p>
        <a href="{{ url_for('cart.remove_from_cart', item_id=item.id) }}">Remove</a>
    </div>
{% endfor %}
<h3>Total: ₹{{ total }}</h3>
{% endblock %}
